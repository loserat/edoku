services:
  edoku:
    build: .
    container_name: edoku_v1
    # Bei vorhandenen Bind-Mounts an deren Eigentümer anpassen; keine Bestandsdaten umchownen.
    user: "${EDOKU_UID:-1000}:${EDOKU_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./output:/app/output
      - ./templates:/app/templates
      - ./storage:/app/storage
    restart: unless-stopped
