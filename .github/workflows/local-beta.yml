name: Lokale Beta prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Festgelegte Abhängigkeiten installieren
        run: npm ci
      - name: Programm und Seitenvorlagen prüfen
        run: npm run check
      - name: Export, Sicherheit, Protokoll, Sicherung und vollständigen Ablauf testen
        run: npm test
      - name: Synthetischen Ablaufnachweis festhalten
        if: always()
        run: |
          if [ -f test-results/local-beta-e2e.json ]; then
            printf '### Vollständiger Ablauf mit künstlichen Beispieldaten\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/local-beta-e2e.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
